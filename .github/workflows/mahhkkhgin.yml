name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate project files
        run: |
          mkdir -p app/src/main/java/com/hastyar/freezetranslate
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FreezeTranslate"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.hastyar.freezetranslate"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.hastyar.freezetranslate"
                  minSdk = 30
                  targetSdk = 34
                  versionCode = 9
                  versionName = "9.0"
                  ndk {
                      abiFilters += listOf("arm64-v8a")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("com.google.mlkit:text-recognition:16.0.0")
              implementation("com.google.mlkit:text-recognition-japanese:16.0.0")
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="accessibility_desc">خوێنەرەوەی دەق: کلیکی کورت بۆ خوێندنەوەی دەق و ناردنی بۆ شوێنی نووسین، داگرتنی درێژ بۆ دیاریکردنی شوێنی نوێ.</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="Text Reader"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FreezeService"
                      android:exported="true"
                      android:label="Text Reader"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canTakeScreenshot="true"
              android:notificationTimeout="100"
              android:description="@string/accessibility_desc" />
          EOF

          cat > app/src/main/java/com/hastyar/freezetranslate/MainActivity.kt <<'EOF'
          package com.hastyar.freezetranslate

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  root.setPadding(48, 120, 48, 48)

                  val info = TextView(this)
                  info.textSize = 16f
                  info.text = "١. «Restricted settings» چالاک بکە: دوگمەی یەکەم دابگرە، ئینجا سێ خاڵەکەی سەرەوە (⋮) و «Allow restricted settings».\n\n" +
                          "٢. دوگمەی دووەم دابگرە و لە لیستەکەدا «Text Reader» بکەرەوە و بیکە ON.\n\n" +
                          "٣. ئایکۆنێکی بازنەیی شەفاف (🌐) دەردەکەوێت:\n" +
                          "• کلیکی کورت: دەقەکە دەخوێنێتەوە و دەیخاتە ناو Clipboard و خانەی نووسینەوە.\n" +
                          "• دەست لەسەر داگرتن (Long Press): دیاریکردنی شوێنی وێنەگرتن.\n" +
                          "• ڕاکێشان: گواستنەوەی ئایکۆنەکە بۆ هەر شوێنێک.\n\n" +
                          "٤. لە خوارەوە زمانی دەقەکە هەڵبژێرە."
                  root.addView(info)

                  val prefs = getSharedPreferences("settings", MODE_PRIVATE)
                  val rg = RadioGroup(this)
                  val rb1 = RadioButton(this)
                  rb1.id = View.generateViewId()
                  rb1.text = "English / لاتینی"
                  val rb2 = RadioButton(this)
                  rb2.id = View.generateViewId()
                  rb2.text = "日本語 / ژاپۆنی"
                  rg.addView(rb1)
                  rg.addView(rb2)
                  rg.check(if (prefs.getString("ocr", "latin") == "ja") rb2.id else rb1.id)
                  rg.setOnCheckedChangeListener { _, checkedId ->
                      prefs.edit().putString("ocr", if (checkedId == rb2.id) "ja" else "latin").apply()
                  }
                  root.addView(rg)

                  addButton(root, "١. Restricted settings (زانیاری بەرنامەکە)") {
                      startActivity(
                          Intent(
                              Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                              Uri.parse("package:$packageName")
                          )
                      )
                  }
                  addButton(root, "٢. کردنەوەی ڕێکخستنی Accessibility") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  addButton(root, "سڕینەوەی لاکێشە پاشەکەوتکراوەکان") {
                      getSharedPreferences("region", MODE_PRIVATE).edit().clear().apply()
                      Toast.makeText(this, "سڕایەوە", Toast.LENGTH_SHORT).show()
                  }

                  val sv = ScrollView(this)
                  sv.addView(root)
                  setContentView(sv)
              }

              private fun addButton(root: LinearLayout, text: String, onClick: () -> Unit) {
                  val b = Button(this)
                  b.text = text
                  b.setOnClickListener { onClick() }
                  root.addView(b)
              }
          }
          EOF

          cat > app/src/main/java/com/hastyar/freezetranslate/FreezeService.kt <<'EOF'
          package com.hastyar.freezetranslate

          import android.accessibilityservice.AccessibilityService
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.util.DisplayMetrics
          import android.view.Display
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.TextView
          import android.widget.Toast
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.TextRecognizer
          import com.google.mlkit.vision.text.japanese.JapaneseTextRecognizerOptions
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions

          class FreezeService : AccessibilityService() {

              private lateinit var wm: WindowManager
              private val handler = Handler(Looper.getMainLooper())

              private var floatingBtn: View? = null
              private var selector: SelectionView? = null
              private var busy = false
              private var jobId = 0
              private var recognizer: TextRecognizer? = null
              private var recognizerKey: String? = null

              private val busyReset = Runnable {
                  busy = false
                  jobId++
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  createFloatingButton()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              // ---------- Floating Icon ----------

              private fun createFloatingButton() {
                  if (floatingBtn != null) return

                  val btn = TextView(this).apply {
                      text = "🌐"
                      textSize = 22f
                      gravity = Gravity.CENTER
                      val bg = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(0x331E1E2E.toInt())
                          setStroke(dp(2), 0x4400FFFF.toInt())
                      }
                      background = bg
                      alpha = 0.20f
                      elevation = 8f
                  }

                  val size = dp(48)
                  val (sw, _) = realSize()
                  val lp = WindowManager.LayoutParams(
                      size, size,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = sw - dp(60)
                      y = dp(140)
                      layoutInDisplayCutoutMode = 3
                  }

                  btn.setOnTouchListener(object : View.OnTouchListener {
                      private var initialX = 0
                      private var initialY = 0
                      private var initialTouchX = 0f
                      private var initialTouchY = 0f
                      private var isDragging = false
                      private var isLongPressed = false

                      private val longPressRunnable = Runnable {
                          if (!isDragging) {
                              isLongPressed = true
                              btn.alpha = 0.20f
                              startSelection()
                          }
                      }

                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  isDragging = false
                                  isLongPressed = false
                                  initialX = lp.x
                                  initialY = lp.y
                                  initialTouchX = event.rawX
                                  initialTouchY = event.rawY
                                  btn.alpha = 0.85f
                                  handler.postDelayed(longPressRunnable, 500)
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val dx = (event.rawX - initialTouchX).toInt()
                                  val dy = (event.rawY - initialTouchY).toInt()
                                  if (Math.hypot(dx.toDouble(), dy.toDouble()) > 10) {
                                      if (!isDragging) {
                                          isDragging = true
                                          handler.removeCallbacks(longPressRunnable)
                                      }
                                      lp.x = initialX + dx
                                      lp.y = initialY + dy
                                      try { wm.updateViewLayout(v, lp) } catch (e: Exception) { }
                                  }
                                  return true
                              }
                              MotionEvent.ACTION_UP -> {
                                  handler.removeCallbacks(longPressRunnable)
                                  btn.alpha = 0.20f
                                  if (!isDragging && !isLongPressed) {
                                      jobId++
                                      busy = false
                                      handler.removeCallbacks(busyReset)
                                      readTextNow()
                                  }
                                  return true
                              }
                              MotionEvent.ACTION_CANCEL -> {
                                  handler.removeCallbacks(longPressRunnable)
                                  btn.alpha = 0.20f
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  try {
                      wm.addView(btn, lp)
                      floatingBtn = btn
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun removeFloatingButton() {
                  floatingBtn?.let {
                      try { wm.removeView(it) } catch (e: Exception) { }
                  }
                  floatingBtn = null
              }

              // ---------- saved region ----------

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun realSize(): Pair<Int, Int> {
                  val dm = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  wm.defaultDisplay.getRealMetrics(dm)
                  return Pair(dm.widthPixels, dm.heightPixels)
              }

              private fun orientationKey(): String {
                  val (sw, sh) = realSize()
                  return if (sw > sh) "land" else "port"
              }

              private fun saveRect(r: Rect) {
                  val k = orientationKey()
                  getSharedPreferences("region", MODE_PRIVATE).edit()
                      .putInt(k + "_l", r.left)
                      .putInt(k + "_t", r.top)
                      .putInt(k + "_r", r.right)
                      .putInt(k + "_b", r.bottom)
                      .apply()
              }

              private fun loadRect(): Rect? {
                  val k = orientationKey()
                  val p = getSharedPreferences("region", MODE_PRIVATE)
                  if (!p.contains(k + "_l")) return null
                  return Rect(
                      p.getInt(k + "_l", 0),
                      p.getInt(k + "_t", 0),
                      p.getInt(k + "_r", 0),
                      p.getInt(k + "_b", 0)
                  )
              }

              // ---------- region selection ----------

              private fun startSelection() {
                  if (selector != null) return
                  jobId++
                  busy = false
                  handler.removeCallbacks(busyReset)
                  val sv = SelectionView(this) { rect -> onSelected(rect) }
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.layoutInDisplayCutoutMode = 3
                  wm.addView(sv, lp)
                  selector = sv
              }

              private fun onSelected(rect: Rect?) {
                  selector?.let {
                      try { wm.removeView(it) } catch (e: Exception) { }
                  }
                  selector = null
                  if (rect == null || rect.width() < 24 || rect.height() < 24) return
                  saveRect(rect)
                  handler.postDelayed({ readTextNow() }, 250)
              }

              // ---------- capture -> OCR -> insert to field / clipboard ----------

              private fun readTextNow() {
                  if (busy) return
                  val rect = loadRect()
                  if (rect == null) {
                      startSelection()
                      return
                  }
                  busy = true
                  val id = ++jobId
                  handler.removeCallbacks(busyReset)
                  handler.postDelayed(busyReset, 8000)
                  handler.postDelayed({ if (id == jobId) capture(id, rect, 0) }, 150)
              }

              private fun fail(id: Int, msg: String) {
                  if (id != jobId) return
                  busy = false
                  handler.removeCallbacks(busyReset)
                  Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
              }

              private fun done(id: Int) {
                  if (id != jobId) return
                  busy = false
                  handler.removeCallbacks(busyReset)
              }

              private fun capture(id: Int, rect: Rect, attempt: Int) {
                  takeScreenshot(
                      Display.DEFAULT_DISPLAY,
                      mainExecutor,
                      object : AccessibilityService.TakeScreenshotCallback {
                          override fun onSuccess(result: AccessibilityService.ScreenshotResult) {
                              var crop: Bitmap? = null
                              try {
                                  val hb = result.hardwareBuffer
                                  val hw = Bitmap.wrapHardwareBuffer(hb, result.colorSpace)
                                  if (hw != null) {
                                      val soft = hw.copy(Bitmap.Config.ARGB_8888, false)
                                      hw.recycle()
                                      if (soft != null) {
                                          val r = Rect(rect)
                                          if (r.intersect(0, 0, soft.width, soft.height)) {
                                              crop = Bitmap.createBitmap(soft, r.left, r.top, r.width(), r.height())
                                          }
                                          soft.recycle()
                                      }
                                  }
                                  hb.close()
                              } catch (e: Exception) {
                                  crop = null
                              }
                              if (id != jobId) {
                                  crop?.recycle()
                                  return
                              }
                              if (crop == null) {
                                  fail(id, "نەتوانرا وێنە بگیرێت")
                                  return
                              }
                              recognize(id, crop)
                          }

                          override fun onFailure(errorCode: Int) {
                              if (id != jobId) return
                              if (errorCode == AccessibilityService.ERROR_TAKE_SCREENSHOT_INTERVAL_TIME_SHORT && attempt < 3) {
                                  handler.postDelayed({ if (id == jobId) capture(id, rect, attempt + 1) }, 300)
                              } else {
                                  fail(id, "نەتوانرا شاشە بگیرێت (" + errorCode + ")")
                              }
                          }
                      }
                  )
              }

              private fun getRecognizer(): TextRecognizer {
                  val key = getSharedPreferences("settings", MODE_PRIVATE).getString("ocr", "latin") ?: "latin"
                  var rec = recognizer
                  if (rec == null || recognizerKey != key) {
                      rec?.close()
                      rec = if (key == "ja") {
                          TextRecognition.getClient(JapaneseTextRecognizerOptions.Builder().build())
                      } else {
                          TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
                      }
                      recognizer = rec
                      recognizerKey = key
                  }
                  return rec!!
              }

              private fun recognize(id: Int, bmp: Bitmap) {
                  val rec = getRecognizer()
                  rec.process(InputImage.fromBitmap(bmp, 0))
                      .addOnSuccessListener { result ->
                          bmp.recycle()
                          if (id != jobId) return@addOnSuccessListener
                          val src = result.text.replace(Regex("\\s+"), " ").trim()
                          if (src.isEmpty()) {
                              fail(id, "دەقێک نەدۆزرایەوە")
                              return@addOnSuccessListener
                          }
                          
                          // ناردنی دەقەکە بۆ Clipboard بۆ ئەوەی ڕاستەوخۆ لە هەموو شوێنێک بەردەست بێت
                          val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          val clip = ClipData.newPlainText("ExtractedText", src)
                          clipboard.setPrimaryClip(clip)

                          // هەوڵدان بۆ نووسینی ڕاستەوخۆ لە هەر خانەیەکی چالاکی ناوەوە (ئەگەر هەبێت)
                          var injected = false
                          val rootNode = rootInActiveWindow
                          if (rootNode != null) {
                              injected = findAndSetText(rootNode, src)
                              rootNode.recycle()
                          }

                          if (injected) {
                              Toast.makeText(this, "دەقەکە خرایە ناو خانەکەوە", Toast.LENGTH_SHORT).show()
                          } else {
                              Toast.makeText(this, "دەقەکە کۆپی کرا: $src", Toast.DEFAULT_DURATION).show()
                          }
                          done(id)
                      }
                      .addOnFailureListener { e ->
                          bmp.recycle()
                          fail(id, "OCR: " + (e.message ?: ""))
                      }
              }

              private fun findAndSetText(node: AccessibilityNodeInfo, text: String): Boolean {
                  if (node.isEditable) {
                      val arguments = Bundle()
                      arguments.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                      if (node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, arguments)) {
                          return true
                      }
                  }
                  for (i in 0 until node.childCount) {
                      val child = node.getChild(i) ?: continue
                      if (findAndSetText(child, text)) {
                          child.recycle()
                          return true
                      }
                      child.recycle()
                  }
                  return false
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  jobId++
                  removeFloatingButton()
                  selector?.let { try { wm.removeView(it) } catch (e: Exception) { } }
                  selector = null
                  recognizer?.close()
                  recognizer = null
                  super.onDestroy()
              }
          }

          class SelectionView(ctx: Context, private val onDone: (Rect?) -> Unit) : View(ctx) {
              private val fill = Paint().apply { color = 0x2200FFFF }
              private val border = Paint().apply {
                  color = Color.CYAN
                  style = Paint.Style.STROKE
                  strokeWidth = 5f
              }
              private val hint = Paint().apply {
                  color = Color.WHITE
                  textSize = 46f
                  textAlign = Paint.Align.CENTER
                  isAntiAlias = true
              }
              private var x0 = 0f
              private var y0 = 0f
              private var x1 = 0f
              private var y1 = 0f
              private var has = false

              init {
                  setBackgroundColor(0x55000000)
              }

              override fun onDraw(c: Canvas) {
                  super.onDraw(c)
                  c.drawText("شوێنی دەقەکە دیاری بکە (کلیکی سادە = هەڵوەشاندنەوە)", width / 2f, 140f, hint)
                  if (has) {
                      val l = minOf(x0, x1)
                      val t = minOf(y0, y1)
                      val r = maxOf(x0, x1)
                      val b = maxOf(y0, y1)
                      c.drawRect(l, t, r, b, fill)
                      c.drawRect(l, t, r, b, border)
                  }
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.action) {
                      MotionEvent.ACTION_DOWN -> {
                          x0 = e.x; y0 = e.y; x1 = e.x; y1 = e.y
                          has = true
                          invalidate()
                      }
                      MotionEvent.ACTION_MOVE -> {
                          x1 = e.x; y1 = e.y
                          invalidate()
                      }
                      MotionEvent.ACTION_UP -> {
                          x1 = e.x; y1 = e.y
                          val loc = IntArray(2)
                          getLocationOnScreen(loc)
                          val r = Rect(
                              minOf(x0, x1).toInt() + loc[0],
                              minOf(y0, y1).toInt() + loc[1],
                              maxOf(x0, x1).toInt() + loc[0],
                              maxOf(y0, y1).toInt() + loc[1]
                          )
                          onDone(r)
                      }
                      MotionEvent.ACTION_CANCEL -> onDone(null)
                  }
                  return true
              }
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TextReader-APK
          path: app/build/outputs/apk/debug/app-debug.apk
